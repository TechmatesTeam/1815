services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/1815_dev
      - REDIS_URL=redis://redis:6379
      - MAILHOG_HOST=mailhog
      - MAILHOG_PORT=1025
    depends_on:
      - mongodb
      - redis
      - mailhog
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - 1815-network

  mongodb:
    image: mongo:7.0
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=1815_dev
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - 1815-network

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - 1815-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - 1815-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    networks:
      - 1815-network

volumes:
  mongodb_data:
  redis_data:

networks:
  1815-network:
    driver: bridge
