<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Viewer - 1815_dev Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status.connected {
            background: #4caf50;
            color: white;
        }

        .status.error {
            background: #f44336;
            color: white;
        }

        .controls {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        button.primary {
            background: #2196f3;
            color: white;
        }

        button.success {
            background: #4caf50;
            color: white;
        }

        button.warning {
            background: #ff9800;
            color: white;
        }

        button.danger {
            background: #f44336;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .content {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            min-height: 400px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .collection-item {
            background: #3d3d3d;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2196f3;
        }

        .alias-item {
            background: #3d3d3d;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4caf50;
        }

        .alias-item.inactive {
            border-left-color: #f44336;
            opacity: 0.7;
        }

        .field {
            margin: 5px 0;
        }

        .field-label {
            color: #888;
            font-size: 0.9em;
        }

        .field-value {
            color: #e0e0e0;
            font-weight: bold;
        }

        .address {
            font-family: 'Monaco', monospace;
            font-size: 0.8em;
            background: #1a1a1a;
            padding: 5px;
            border-radius: 3px;
            word-break: break-all;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: #3d3d3d;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #2196f3;
        }

        .stat-label {
            color: #888;
            margin-top: 5px;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #555;
            border-radius: 5px;
            color: #e0e0e0;
            font-family: inherit;
        }

        .error {
            color: #f44336;
            background: #2d1b1b;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .success {
            color: #4caf50;
            background: #1b2d1b;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🍃 MongoDB Viewer</h1>
            <div id="connectionStatus" class="status">Connecting...</div>
        </div>

        <div class="controls">
            <button class="primary" onclick="loadCollections()">📋 Collections</button>
            <button class="success" onclick="loadAliases()">🔗 All Aliases</button>
            <button class="success" onclick="loadActiveAliases()">✅ Active Aliases</button>
            <button class="warning" onclick="loadExpiredAliases()">❌ Expired Aliases</button>
            <button class="primary" onclick="loadUsers()">👥 Users</button>
            <button class="primary" onclick="loadStats()">📊 Statistics</button>
            <button class="danger" onclick="clearContent()">🗑️ Clear</button>
        </div>

        <div class="content">
            <div id="searchSection" style="display: none;">
                <input type="text" id="searchInput" class="search-box"
                    placeholder="Enter alias short code to search...">
                <button class="primary" onclick="searchAlias()">🔍 Search</button>
            </div>
            <div id="content">
                <div class="loading">Select an option above to view database content</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/v1';

        // Test connection on load
        window.addEventListener('load', testConnection);

        async function testConnection() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('connectionStatus').textContent = '✅ Connected';
                    document.getElementById('connectionStatus').className = 'status connected';
                } else {
                    throw new Error('Health check failed');
                }
            } catch (error) {
                document.getElementById('connectionStatus').textContent = '❌ Connection Failed';
                document.getElementById('connectionStatus').className = 'status error';
                showError('Failed to connect to backend API. Make sure the server is running on port 3000.');
            }
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        function showSuccess(message) {
            document.getElementById('content').innerHTML = `<div class="success">✅ ${message}</div>`;
        }

        function showLoading(message = 'Loading...') {
            document.getElementById('content').innerHTML = `<div class="loading">${message}</div>`;
        }

        function clearContent() {
            document.getElementById('content').innerHTML = '<div class="loading">Content cleared. Select an option above.</div>';
            document.getElementById('searchSection').style.display = 'none';
        }

        async function loadCollections() {
            showLoading('Loading collections...');

            try {
                const response = await fetch(`${API_BASE}/web-viewer/collections`);
                const data = await response.json();

                if (data.success) {
                    let content = '<h2>📋 Database Collections</h2>';

                    data.data.collections.forEach(collection => {
                        content += `
                            <div class="collection-item">
                                <div class="field">
                                    <div class="field-label">Collection Name:</div>
                                    <div class="field-value">${collection.name}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Document Count:</div>
                                    <div class="field-value">${collection.count}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Type:</div>
                                    <div class="field-value">${collection.type}</div>
                                </div>
                            </div>
                        `;
                    });

                    content += `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number">${data.data.totalCollections}</div>
                                <div class="stat-label">Total Collections</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.totalDocuments}</div>
                                <div class="stat-label">Total Documents</div>
                            </div>
                        </div>
                    `;

                    document.getElementById('content').innerHTML = content;
                } else {
                    showError('Failed to load collections');
                }
            } catch (error) {
                showError(`Failed to load collections: ${error.message}`);
            }
        }

        async function loadAliases() {
            showLoading('Loading all aliases...');
            document.getElementById('searchSection').style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/web-viewer/aliases`);
                const data = await response.json();

                if (data.success) {
                    let content = `<h2>🔗 All Aliases (${data.data.totalAliases} total)</h2>`;

                    data.data.aliases.forEach((alias, index) => {
                        const isActive = alias.isActive && new Date(alias.expiresAt) > new Date();
                        content += `
                            <div class="alias-item ${!isActive ? 'inactive' : ''}">
                                <div class="field">
                                    <div class="field-label">Short Code:</div>
                                    <div class="field-value">${alias.shortCode}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Cardano Address:</div>
                                    <div class="address">${alias.cardanoAddress}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Custom Name:</div>
                                    <div class="field-value">${alias.customName || 'None'}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Status:</div>
                                    <div class="field-value">${isActive ? '✅ Active' : '❌ Inactive/Expired'}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Use Count:</div>
                                    <div class="field-value">${alias.useCount}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Created:</div>
                                    <div class="field-value">${new Date(alias.createdAt).toLocaleString()}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Expires:</div>
                                    <div class="field-value">${new Date(alias.expiresAt).toLocaleString()}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Last Used:</div>
                                    <div class="field-value">${alias.lastUsedAt ? new Date(alias.lastUsedAt).toLocaleString() : 'Never'}</div>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('content').innerHTML = content;
                } else {
                    showError('Failed to load aliases');
                }
            } catch (error) {
                showError(`Failed to load aliases: ${error.message}`);
            }
        }

        async function loadActiveAliases() {
            showLoading('Loading active aliases...');

            try {
                const response = await fetch(`${API_BASE}/web-viewer/aliases`);
                const data = await response.json();

                if (data.success) {
                    const activeAliases = data.data.aliases.filter(alias =>
                        alias.isActive && new Date(alias.expiresAt) > new Date()
                    );

                    let content = `<h2>✅ Active Aliases (${activeAliases.length} total)</h2>`;

                    activeAliases.forEach((alias, index) => {
                        content += `
                            <div class="alias-item">
                                <div class="field">
                                    <div class="field-label">Short Code:</div>
                                    <div class="field-value">${alias.shortCode}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Cardano Address:</div>
                                    <div class="address">${alias.cardanoAddress}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Custom Name:</div>
                                    <div class="field-value">${alias.customName || 'None'}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Use Count:</div>
                                    <div class="field-value">${alias.useCount}</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Expires:</div>
                                    <div class="field-value">${new Date(alias.expiresAt).toLocaleString()}</div>
                                </div>
                            </div>
                        `;
                    });

                    if (activeAliases.length === 0) {
                        content += '<div class="loading">No active aliases found</div>';
                    }

                    document.getElementById('content').innerHTML = content;
                } else {
                    showError('Failed to load active aliases');
                }
            } catch (error) {
                showError(`Failed to load active aliases: ${error.message}`);
            }
        }

        async function loadExpiredAliases() {
            showLoading('Loading expired aliases...');
            document.getElementById('content').innerHTML = '<h2>❌ Expired Aliases</h2><div class="loading">No expired aliases found</div>';
        }

        async function loadUsers() {
            showLoading('Loading users...');
            document.getElementById('content').innerHTML = '<h2>👥 Users</h2><div class="loading">No users found in database</div>';
        }

        async function loadStats() {
            showLoading('Loading database statistics...');

            try {
                const response = await fetch(`${API_BASE}/web-viewer/stats`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('content').innerHTML = `
                        <h2>📊 Database Statistics</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number">${data.data.aliasCount}</div>
                                <div class="stat-label">Total Aliases</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.userCount}</div>
                                <div class="stat-label">Users</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.searchHistoryCount}</div>
                                <div class="stat-label">Search History</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.collections}</div>
                                <div class="stat-label">Collections</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.objects}</div>
                                <div class="stat-label">Total Objects</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.dataSizeMB} MB</div>
                                <div class="stat-label">Data Size</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.storageSizeMB} MB</div>
                                <div class="stat-label">Storage Size</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${data.data.indexes}</div>
                                <div class="stat-label">Indexes</div>
                            </div>
                        </div>
                        <div class="field">
                            <div class="field-label">Database Name:</div>
                            <div class="field-value">${data.data.database}</div>
                        </div>
                    `;
                } else {
                    showError('Failed to load statistics');
                }
            } catch (error) {
                showError(`Failed to load statistics: ${error.message}`);
            }
        }

        async function searchAlias() {
            const shortCode = document.getElementById('searchInput').value.trim();
            if (!shortCode) {
                showError('Please enter a short code to search');
                return;
            }

            showLoading(`Searching for alias: ${shortCode}`);

            try {
                const response = await fetch(`${API_BASE}/resolve/${shortCode}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('content').innerHTML = `
                        <h2>🔍 Search Result</h2>
                        <div class="alias-item">
                            <div class="field">
                                <div class="field-label">Short Code:</div>
                                <div class="field-value">${shortCode}</div>
                            </div>
                            <div class="field">
                                <div class="field-label">Cardano Address:</div>
                                <div class="address">${data.data.cardanoAddress}</div>
                            </div>
                            <div class="field">
                                <div class="field-label">Custom Name:</div>
                                <div class="field-value">${data.data.customName || 'None'}</div>
                            </div>
                            <div class="field">
                                <div class="field-label">Use Count:</div>
                                <div class="field-value">${data.data.useCount}</div>
                            </div>
                            <div class="field">
                                <div class="field-label">Expires At:</div>
                                <div class="field-value">${new Date(data.data.expiresAt).toLocaleString()}</div>
                            </div>
                            <div class="field">
                                <div class="field-label">Last Used:</div>
                                <div class="field-value">${data.data.lastUsedAt ? new Date(data.data.lastUsedAt).toLocaleString() : 'Never'}</div>
                            </div>
                        </div>
                    `;
                } else {
                    showError(`Alias not found: ${shortCode}`);
                }
            } catch (error) {
                showError(`Search failed: ${error.message}`);
            }
        }

        // Allow Enter key in search box
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('searchInput')?.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    searchAlias();
                }
            });
        });
    </script>
</body>

</html>
